<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXIT KR - 공무원 법률 / 사이드공지</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen pb-28 md:pb-8">

    <!-- Header & Nav Tabs -->
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 shadow-lg">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <span class="bg-indigo-600 text-white font-bold px-2.5 py-1 rounded-lg text-sm tracking-wider">EXIT KR</span>
                <!-- Page Navigation Tabs -->
                <nav class="flex bg-slate-800 p-1 rounded-xl border border-slate-700">
                    <button onclick="switchMainPage('calculator')" id="main-tab-calc" class="px-3 py-1 text-xs sm:text-sm font-semibold rounded-lg bg-indigo-600 text-white transition">
                        <i class="fa-solid fa-calculator mr-1"></i> 벌금 계산기
                    </button>
                    <button onclick="switchMainPage('side-notice')" id="main-tab-notice" class="px-3 py-1 text-xs sm:text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition">
                        <i class="fa-solid fa-bullhorn mr-1"></i> 사이드공지
                    </button>
                </nav>
            </div>
            <button id="reset-btn" onclick="resetSelection()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs sm:text-sm px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-right"></i>
                <span>초기화</span>
            </button>
        </div>
    </header>

    <!-- PAGE 1: 벌금 계산기 -->
    <main id="page-calculator" class="max-w-6xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6 mt-2">
        <!-- Left: Category Tabs & Law List -->
        <div class="lg:col-span-2 space-y-6">
            <div class="flex flex-col sm:flex-row gap-3 justify-between items-center">
                <div class="flex bg-slate-800/80 p-1 rounded-xl w-full sm:w-auto overflow-x-auto border border-slate-700/50">
                    <button onclick="filterCategory('all')" id="tab-all" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-indigo-600 text-white">전체 보기</button>
                    <button onclick="filterCategory('traffic')" id="tab-traffic" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition text-slate-400 hover:text-white">I. 도로교통법</button>
                    <button onclick="filterCategory('felony')" id="tab-felony" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition text-slate-400 hover:text-white">II. 중범죄</button>
                    <button onclick="filterCategory('official')" id="tab-official" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition text-slate-400 hover:text-white">III. 공무원 법</button>
                    <button onclick="filterCategory('rp_robbery')" id="tab-rp_robbery" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition text-slate-400 hover:text-white">IV. RP 범죄/강도</button>
                </div>
                
                <div class="relative w-full sm:w-48">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="죄목 검색..." class="w-full bg-slate-800/80 border border-slate-700 text-slate-200 text-xs rounded-xl pl-8 pr-3 py-2 focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <!-- Law Content Render Container -->
            <div id="law-content" class="space-y-6"></div>
        </div>

        <!-- Right: Calculation Results Panel -->
        <div class="lg:col-span-1">
            <div class="sticky top-20 bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 shadow-2xl backdrop-blur">
                <div class="flex justify-between items-center border-b border-slate-700 pb-3 mb-4">
                    <h2 class="font-bold text-slate-100 flex items-center gap-2">
                        <i class="fa-solid fa-calculator text-indigo-400"></i>
                        계산 결과
                    </h2>
                    <span id="selected-count" class="bg-indigo-500/20 text-indigo-300 text-xs px-2.5 py-1 rounded-full font-semibold border border-indigo-500/30">0건 선택됨</span>
                </div>

                <!-- Modifiers Toggles -->
                <div class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 mb-4 space-y-2.5">
                    <div class="text-xs font-bold text-slate-300 flex items-center gap-1.5 border-b border-slate-800 pb-1.5">
                        <i class="fa-solid fa-sliders text-indigo-400"></i>
                        <span>처벌 옵션 설정</span>
                    </div>

                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-xs text-slate-300 group-hover:text-white flex items-center gap-1.5">
                            <i class="fa-solid fa-baby text-amber-400"></i>
                            <span>뉴비 처벌 50% 감면</span>
                        </span>
                        <input type="checkbox" id="toggle-newbie" onchange="updateSummary()" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500 relative"></div>
                    </label>

                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-xs text-slate-300 group-hover:text-white flex items-center gap-1.5">
                            <i class="fa-solid fa-lock text-rose-400"></i>
                            <span>필수 구금 10분 강제 적용</span>
                        </span>
                        <input type="checkbox" id="toggle-mustjail" onchange="updateSummary()" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-rose-500 relative"></div>
                    </label>

                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-xs text-slate-300 group-hover:text-white flex items-center gap-1.5">
                            <i class="fa-solid fa-bolt text-emerald-400"></i>
                            <span>풀보석금 전환 (1분당 200만)</span>
                        </span>
                        <input type="checkbox" id="toggle-bail" onchange="updateSummary()" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500 relative"></div>
                    </label>
                </div>

                <!-- Selected List Container -->
                <div id="selected-list" class="max-h-48 overflow-y-auto mb-4 space-y-2 pr-1 min-h-[80px] text-xs">
                    <div id="empty-notice" class="h-20 flex flex-col items-center justify-center text-slate-500 gap-1.5">
                        <i class="fa-solid fa-list-check text-xl"></i>
                        <span>선택된 항목이 없습니다.</span>
                    </div>
                </div>

                <!-- Total Amount Card -->
                <div class="bg-slate-900/90 rounded-xl p-4 border border-slate-700/60 space-y-2.5">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-400">최초 총 구금</span>
                        <span id="original-jail" class="font-medium text-slate-300">0분</span>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-400">필수 구금 시간</span>
                        <span id="must-jail" class="font-semibold text-rose-400">0분</span>
                    </div>
                    <div class="flex justify-between items-center text-sm pt-1 border-t border-slate-800">
                        <span class="text-slate-300 font-semibold">최종 구금 시간</span>
                        <span id="total-jail" class="font-bold text-amber-400 text-base">0분</span>
                    </div>
                    <div id="bail-converted-box" class="hidden flex justify-between items-center text-xs text-emerald-400 bg-emerald-950/40 px-2 py-1 rounded border border-emerald-800/40">
                        <span>보석 전환금 (+<span id="bail-minutes">0</span>분)</span>
                        <span id="bail-amount" class="font-bold">+0원</span>
                    </div>
                    <div class="border-t border-slate-800 pt-2 flex justify-between items-end">
                        <span class="text-slate-300 text-sm font-semibold">최종 총 벌금액</span>
                        <span id="total-fine" class="font-extrabold text-emerald-400 text-xl tracking-tight">0원</span>
                    </div>
                </div>

                <!-- Action Button -->
                <button onclick="copySummary()" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium text-sm py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                    <i class="fa-regular fa-copy"></i>
                    <span>처벌 법 명 복사하기</span>
                </button>
            </div>
        </div>
    </main>

    <!-- PAGE 2: 사이드공지 (인트라넷 스타일) -->
    <main id="page-side-notice" class="max-w-6xl mx-auto p-4 hidden space-y-6 mt-2">
        <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
            <i class="fa-solid fa-bullhorn text-indigo-400"></i>
            사이드공지
        </h2>

        <!-- Top Forms Grid (출석·수배 & 영장 RP) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 출석 · 수배 카드 -->
            <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl space-y-4">
                <h3 class="font-bold text-slate-200 text-sm border-b border-slate-700/60 pb-2">출석 · 수배</h3>
                <div class="space-y-3">
                    <input type="text" id="wanted-name" placeholder="닉네임" class="w-full bg-slate-900/90 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500">
                    <input type="text" id="wanted-id" placeholder="고유번호" class="w-full bg-slate-900/90 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500">
                    <input type="text" id="wanted-reason" placeholder="사유" class="w-full bg-slate-900/90 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-3 gap-2 pt-1">
                    <button onclick="copyWantedNotice('attendance')" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-slate-200 text-xs py-2 rounded-xl transition font-medium">출석 요구 복사</button>
                    <button onclick="copyWantedNotice('wanted')" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-slate-200 text-xs py-2 rounded-xl transition font-medium">수배 공지 복사</button>
                    <button onclick="copyWantedNotice('end')" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-slate-200 text-xs py-2 rounded-xl transition font-medium">수배 종료</button>
                </div>
            </div>

            <!-- 영장 RP 카드 -->
            <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl space-y-4">
                <h3 class="font-bold text-slate-200 text-sm border-b border-slate-700/60 pb-2">영장 RP</h3>
                <div class="space-y-3">
                    <input type="text" id="warrant-name" placeholder="닉네임" class="w-full bg-slate-900/90 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500">
                    <input type="text" id="warrant-id" placeholder="고유번호" class="w-full bg-slate-900/90 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500">
                    <input type="text" id="warrant-faction" placeholder="팩션명" class="w-full bg-slate-900/90 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-3 gap-2 pt-1">
                    <button onclick="copyWarrantNotice('convert')" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-slate-200 text-xs py-2 rounded-xl transition font-medium">영장 RP 전환 복사</button>
                    <button onclick="copyWarrantNotice('wait')" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-slate-200 text-xs py-2 rounded-xl transition font-medium">대표 대기 요청 복사</button>
                    <button onclick="copyWarrantNotice('complete')" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-slate-200 text-xs py-2 rounded-xl transition font-medium">영장 확인 완료 복사</button>
                </div>
            </div>

        </div>

        <!-- RP Alpi Tabs & Notice Lists -->
        <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl space-y-5">
            <div class="grid grid-cols-3 gap-2 bg-slate-900/60 p-1.5 rounded-xl border border-slate-700/60">
                <button onclick="switchAlpiTab('atm')" id="alpi-tab-atm" class="alpi-tab-btn py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white transition text-center">ATM 알피</button>
                <button onclick="switchAlpiTab('convenience')" id="alpi-tab-convenience" class="alpi-tab-btn py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition text-center">편의점 알피</button>
                <button onclick="switchAlpiTab('etc')" id="alpi-tab-etc" class="alpi-tab-btn py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition text-center">기타 및 대형 알피</button>
            </div>

            <!-- List Content Box -->
            <div id="alpi-list-container" class="space-y-3">
                <!-- Dynamically Rendered -->
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Summary Bar -->
    <div id="mobile-bar" class="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 p-3 shadow-2xl backdrop-blur z-40">
        <div class="flex justify-between items-center max-w-6xl mx-auto px-2">
            <div>
                <div class="text-[10px] text-slate-400">총 합계 (<span id="mobile-count">0</span>건)</div>
                <div class="flex items-center gap-2">
                    <span id="mobile-fine" class="font-bold text-emerald-400 text-sm">0원</span>
                    <span id="mobile-jail" class="text-xs text-amber-400 font-medium">(0분)</span>
                </div>
            </div>
            <button onclick="window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' })" class="bg-indigo-600 text-white text-xs px-3.5 py-2 rounded-lg font-medium shadow">
                내역 확인
            </button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-20 right-4 lg:bottom-8 lg:right-8 bg-slate-800 border border-indigo-500 text-slate-100 text-xs px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-indigo-400"></i>
        <span id="toast-message">내용이 복사되었습니다.</span>
    </div>

        function updateSummary() {
            const listContainer = document.getElementById('selected-list');
            listContainer.innerHTML = '';

            let rawFine = 0;
            let rawJail = 0;
            let maxItemMustJail = 0;
            let totalCount = 0;

            const isNewbie = document.getElementById('toggle-newbie').checked;
            const forceMustJail = document.getElementById('toggle-mustjail').checked;
            const isBail = document.getElementById('toggle-bail').checked;

            if (selectedMap.size === 0) {
                listContainer.innerHTML = `
                    <div id="empty-notice" class="h-20 flex flex-col items-center justify-center text-slate-500 gap-1.5">
                        <i class="fa-solid fa-list-check text-xl"></i>
                        <span>선택된 항목이 없습니다.</span>
                    </div>
                `;
            } else {
                selectedMap.forEach((count, id) => {
                    const item = lawData.find(l => l.id === id);
                    if (!item) return;

                    rawFine += item.fine * count;
                    rawJail += item.jail * count;
                    if (item.mustJail > maxItemMustJail) {
                        maxItemMustJail = item.mustJail;
                    }
                    totalCount += count;

                    const itemEl = document.createElement('div');
                    itemEl.className = "flex justify-between items-center bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/50";
                    itemEl.innerHTML = `
                        <div class="pr-2 truncate">
                            <div class="font-medium text-slate-200 truncate">${item.title} ${count > 1 ? `<span class="text-indigo-400">x${count}</span>` : ''}</div>
                            <div class="text-[11px] text-slate-400">${item.fine > 0 ? formatMoney(item.fine * count) : '개별처벌'} ${item.jail > 0 ? `| 구금 ${item.jail * count}분` : ''}</div>
                        </div>
                        <button onclick="changeCount(${item.id}, -${count})" class="text-slate-500 hover:text-rose-400 p-1">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                    `;
                    listContainer.appendChild(itemEl);
                });
            }

            let finalMustJail = maxItemMustJail;
            if (forceMustJail && selectedMap.size > 0 && finalMustJail < 10) {
                finalMustJail = 10;
            }

            let calculatedFine = isNewbie ? rawFine * 0.5 : rawFine;
            let calculatedJail = isNewbie ? Math.floor(rawJail * 0.5) : rawJail;
            finalMustJail = isNewbie ? Math.floor(finalMustJail * 0.5) : finalMustJail;

            let finalJail = calculatedJail;
            let bailConvertedAmount = 0;
            let bailMinutes = 0;

            const bailBox = document.getElementById('bail-converted-box');

            if (isBail && calculatedJail > 0 && selectedMap.size > 0) {
                bailMinutes = Math.max(0, calculatedJail - finalMustJail);
                bailConvertedAmount = bailMinutes * BAIL_RATE_PER_MINUTE;
                finalJail = finalMustJail;

                bailBox.classList.remove('hidden');
                document.getElementById('bail-minutes').innerText = bailMinutes;
                document.getElementById('bail-amount').innerText = `+${formatMoney(bailConvertedAmount)}`;
            } else {
                bailBox.classList.add('hidden');
            }

            let finalFine = calculatedFine + bailConvertedAmount;

            document.getElementById('selected-count').innerText = `${totalCount}건 선택됨`;
            document.getElementById('original-jail').innerText = `${rawJail}분`;
            document.getElementById('must-jail').innerText = `${finalMustJail}분`;
            document.getElementById('total-jail').innerText = `${finalJail}분`;
            document.getElementById('total-fine').innerText = formatMoney(finalFine);

            document.getElementById('mobile-count').innerText = totalCount;
            document.getElementById('mobile-fine').innerText = formatMoney(finalFine);
            document.getElementById('mobile-jail').innerText = `(${finalJail}분)`;
        }

                if (item) {
                    titles.push(count > 1 ? `${item.title} x${count}` : item.title);

            const text = titles.join('\n');
            await executeCopy(text, '처벌 법 명칭이 복사되었습니다.');

        function copyWantedNotice(type) {
            const name = document.getElementById('wanted-name').value.trim();
            const id = document.getElementById('wanted-id').value.trim();
            const reason = document.getElementById('wanted-reason').value.trim();

            if (type !== 'end' && (!name || !id)) {
                showToast('고유번호와 닉네임을 입력하세요.');
                return;
            }

            let text = '';
            
            if (type === 'attendance') {
                const time15 = getTimeFormatted(15);
                text = `/경찰청 [ 출석요구서 ] 닉네임 : ${name} 고유번호 : ${id} 사유 : ${reason} ${time15} 까지 출석바랍니다. -『 엑시트 경찰청 』-`;
            } else if (type === 'wanted') {
                const timeNow = getTimeFormatted(0);
                const time30 = getTimeFormatted(30);
                text = `/경찰청 [ 수배공지 ] 닉네임 : ${name} 고유번호 : ${id} ${timeNow} ~ ${time30} 수배알피 진행합니다. 위치추적 시작하겠습니다. -『 엑시트 경찰청 』-`;
            } else if (type === 'end') {
                text = `/경찰청 수배 상황 종료되었습니다.`;
            }

            executeCopy(text, '경찰청 공지 문구가 복사되었습니다.');
        }

        // 영장 RP 경찰청 지정 양식 복사 (팩션명 필수 입력 검사 추가)
        function copyWarrantNotice(type) {
            const name = document.getElementById('warrant-name').value.trim();
            const id = document.getElementById('warrant-id').value.trim();
            const faction = document.getElementById('warrant-faction').value.trim();

            if (type === 'convert' && (!name || !id)) {
                showToast('고유번호와 닉네임을 입력하세요.');
                return;
            }
            if ((type === 'wait' || type === 'complete') && !faction) {
                showToast('팩션명을 입력하세요.');
                return;
            }

            let text = '';
            if (type === 'convert') {
                text = `/경찰청 고유번호 ${id} 닉네임 ${name} 님 수배 RP 진행 도중 사유지에 있는 것이 확인되어 수배 RP 가 사유지에 대한 영장 RP 로 전환됨을 통보합니다.`;
            } else if (type === 'wait') {
                text = `/경찰청 ${faction} 팩션 대표는 발부된 영장 확인을 위해 사유지 앞에서 대기 하시길 바랍니다.`;
            } else if (type === 'complete') {
                text = `/경찰청 ${faction} 팩션에 대한 영장 확인이 완료되었습니다. 준비되신 경우 인원 공표 해주시길 바랍니다.`;
            }

            executeCopy(text, '영장 RP 공지가 복사되었습니다.');
        }

        async function copyText(text) {
            await executeCopy(text, '사이드공지 문구가 복사되었습니다.');
        }

        async function executeCopy(text, successMessage) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                }
                showToast(successMessage);
            } catch (err) {
                showToast('복사에 실패했습니다. 권한을 확인해주세요.');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
